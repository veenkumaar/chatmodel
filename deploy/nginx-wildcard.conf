# ==============================================================================
# Nginx Dynamic Multi-Tenant Subdomain & Whitelabel Configuration
# Location on Ubuntu / Debian: /etc/nginx/sites-available/chatmodel
# Symlink: ln -s /etc/nginx/sites-available/chatmodel /etc/nginx/sites-enabled/
# ==============================================================================

# 1. Main Platform, Wildcard Subdomains & Whitelabel CNAME Domains
server {
    server_name chatmodel.in www.chatmodel.in *.chatmodel.in _;
    root /var/www/html/chatmodel;

    index index.php index.html;

    access_log /var/log/nginx/chatmodel_access.log;
    error_log /var/log/nginx/chatmodel_error.log;

    # Performance & Upload Limits
    client_max_body_size 25M;
    keepalive_timeout 65;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss text/javascript image/svg+xml;

    # Protect SQLite Database folder & sensitive files from direct HTTP access
    location ^~ /data/ {
        deny all;
        return 404;
    }

    location ^~ /db/ {
        deny all;
        return 404;
    }

    location = /.well-known/api-catalog {
        default_type application/linkset+json;
        add_header Content-Type "application/linkset+json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /.well-known/openid-configuration {
        default_type application/json;
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /.well-known/oauth-authorization-server {
        default_type application/json;
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /.well-known/oauth-protected-resource {
        default_type application/json;
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /.well-known/mcp/server-card.json {
        default_type application/json;
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /.well-known/agent-skills/index.json {
        default_type application/json;
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /.well-known/ai-catalog.json {
        default_type application/json;
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /auth.md {
        default_type text/markdown;
        add_header Content-Type "text/markdown; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    location ~* \.(db|sqlite|sqlite3|sql|log|ini|env|sh|md|git|bak|backup)$ {
        deny all;
        return 404;
    }

    # Static Assets Caching
    location ~* \.(jpg|jpeg|gif|png|webp|svg|ico|css|js|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }

    # Main Application Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM FastCGI Handler
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock; # Adjust PHP version (e.g. php8.1-fpm, php8.2-fpm, php8.3-fpm)
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        include fastcgi_params;
    }

    listen 80;
    # HTTPS / SSL (Automatically managed by Certbot):
    # listen 443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/chatmodel.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/chatmodel.in/privkey.pem;
}
