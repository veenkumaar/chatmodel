<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary-color: #007bff;
            --bg-color: #f8f9fa;
            --chat-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e9ecef;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh; /* Better for mobile browsers */
            color: var(--text-color);
        }

        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 80vh;
            background-color: var(--chat-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .chat-header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }
        
        .message p {
            margin-bottom: 8px;
        }
        .message p:last-child {
            margin-bottom: 0;
        }

        .message table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 0.9rem;
        }

        .message th, .message td {
            border: 1px solid rgba(0, 0, 0, 0.1);
            padding: 8px;
            text-align: left;
        }

        .message th {
            background-color: rgba(0, 0, 0, 0.05);
            font-weight: 600;
        }

        .message.user {
            background-color: var(--primary-color);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            background-color: #f1f3f5;
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 5px;
            align-self: flex-start;
            max-width: 80%;
        }

        .quick-reply-btn {
            background-color: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            border-radius: 16px;
            padding: 8px 14px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-reply-btn:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .chat-input-container {
            padding: 20px;
            background-color: var(--chat-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            outline: none;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: var(--primary-color);
        }

        .send-button {
            flex-shrink: 0;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .send-button:hover {
            background-color: #0056b3;
        }

        .send-button:active {
            transform: scale(0.95);
        }

        @media (max-width: 480px) {
            .chat-container {
                height: 100dvh;
                border-radius: 0;
                border: none;
            }
        }

        .send-button svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            margin-left: 2px;
        }
        
        .loading {
            align-self: flex-start;
            display: none;
            gap: 4px;
            padding: 12px 16px;
            background-color: #f1f3f5;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
        }

        .loading.active {
            display: flex;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #adb5bd;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            AI Assistant
        </div>
        
        <div class="chat-messages" id="chat-messages">
            <div class="message bot">Hello! How can I help you today?</div>
            
            <!-- Loading indicator -->
            <div class="loading" id="loading-indicator">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

        <div class="chat-input-container">
            <input type="text" id="chat-input" class="chat-input" placeholder="Type a message..." autocomplete="off">
            <button class="send-button" id="send-btn" aria-label="Send">
                <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
        </div>
    </div>

    <script>
        // The webhook URL is securely hidden behind a Vercel Serverless Function
        const WEBHOOK_URL = '/api/webhook';
        
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const loadingIndicator = document.getElementById('loading-indicator');

        // Generate a random session ID for memory in n8n
        const sessionId = Math.random().toString(36).substring(2, 15);

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            
            if (sender === 'bot') {
                messageDiv.innerHTML = marked.parse(text);
            } else {
                messageDiv.textContent = text;
            }
            
            
            // Insert before loading indicator
            chatMessages.insertBefore(messageDiv, loadingIndicator);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showLoading(show) {
            if (show) {
                loadingIndicator.classList.add('active');
                scrollToBottom();
            } else {
                loadingIndicator.classList.remove('active');
            }
        }

        async function sendMessage(overrideText = null) {
            const text = typeof overrideText === 'string' ? overrideText : chatInput.value.trim();
            if (!text) return;

            // Remove existing quick replies if any when a message is sent
            const existingReplies = document.querySelectorAll('.quick-replies');
            existingReplies.forEach(el => el.remove());

            // 1. Add user message to UI
            addMessage(text, 'user');
            if (typeof overrideText !== 'string') {
                chatInput.value = '';
            }
            
            // 2. Show loading
            showLoading(true);

            try {
                // 3. Send request to n8n webhook
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: text,
                        sessionId: sessionId
                    })
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const contentType = response.headers.get("content-type");
                let botResponseText = "";
                let quickReplies = null;
                
                if (contentType && contentType.includes("application/json")) {
                    const data = await response.json();
                    botResponseText = data.output || data.response || data.text || data.message || "Message received, but format unknown.";
                    if (data.quick_replies && Array.isArray(data.quick_replies)) {
                        quickReplies = data.quick_replies;
                    }
                } else {
                    botResponseText = await response.text();
                }
                
                showLoading(false);
                
                addMessage(botResponseText, 'bot');

                if (quickReplies && quickReplies.length > 0) {
                    renderQuickReplies(quickReplies);
                }
                
            } catch (error) {
                console.error('Error:', error);
                showLoading(false);
                addMessage('Sorry, there was an error connecting to the server.', 'bot');
            }
        }

        function renderQuickReplies(replies) {
            const container = document.createElement('div');
            container.classList.add('quick-replies');
            
            replies.forEach(reply => {
                const btn = document.createElement('button');
                btn.classList.add('quick-reply-btn');
                btn.textContent = reply;
                btn.onclick = () => sendMessage(reply);
                container.appendChild(btn);
            });
            
            chatMessages.insertBefore(container, loadingIndicator);
            scrollToBottom();
        }

        sendBtn.addEventListener('click', () => sendMessage());
        
        chatInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
